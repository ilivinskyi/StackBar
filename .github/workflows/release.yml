name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach assets to (e.g. v1.2.0)
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Read version from tag
        id: version
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' is not in the form vX.Y.Z"
          }
          "value=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TaskbarGrouper.sln

      - name: Build
        run: dotnet build TaskbarGrouper.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test TaskbarGrouper.sln -c Release --no-build

      - name: Package
        shell: powershell
        run: .\build.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @('release', 'create', $env:TAG, '--verify-tag', '--generate-notes', '--title', $env:TAG)
            if ($env:TAG.Contains('-')) { $createArgs += '--prerelease' }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $env:TAG" }
          }
          # Only the two distributables: never the loose portable folder, its .portable flag or data/
          gh release upload $env:TAG artifacts/StackBar-Setup.exe artifacts/StackBar-Portable.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload assets to $env:TAG" }
